# DeepSeek Harness bundle patch for dsh-plugin-orca-pod.
#
# The install root is this package (the repository root): `dsh plugin --profile
# <name> add <path to this directory>` links it into the profile and appends the
# bundle to `dsh.profile.bundles`. DSH resolves the row's `name` through the
# profile's node_modules, so it must be the package name from package.json.
#
# First-party code builds from `src/` into `lib/`; runtime dependencies come
# from package.json (fastify, ulid, zod, `@agentclientprotocol/sdk`,
# `cross-spawn`, `bs58`, `undici` and the `@deepseek-ai/dsh-*` infrastructure
# packages; see `docs/implementation.md` 6 for the dependency choices).
#
# No credentials are bundled; no node settings in this config take effect: the
# plugin's config schema keeps only `skill_injection` and silently drops
# unknown keys (including `workgroup_password`, `port` and `peers`). The panel
# stores the password in the DSH credential store and the workgroup id and
# listen address in `<data_root>/settings.json`; until then the node does not
# listen at all. The default listen address is loopback, and the panel asks
# which interface should be exposed to peers.
- insert:
    - id: dsh-plugin-orca-pod
      name: "dsh-plugin-orca-pod"
      config:
        port: 11811
        peers: []
