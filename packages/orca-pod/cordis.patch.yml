# DeepSeek Harness bundle patch for orca-pod.
#
# The install root is this package: `dsh plugin --profile <name> add <path to
# packages/orca-pod>` links it into the profile and appends the bundle to
# `dsh.profile.bundles`. DSH resolves the row's `name` through the profile's
# node_modules, so it must be the package name from package.json.
#
# The package is self-contained: its only runtime dependency is fastify, and
# all first-party modules live under `src/`.
#
# SECURITY NOTE: this row carries a plaintext workgroup password for the
# prototype only. Do not reuse a real workgroup password here: keep local
# testing throwaway, and move the password to the DSH credentials service for a
# production install (see README.md).
- insert:
    - id: orca-pod
      name: 'orca-pod'
      config:
        workgroup_id: orca-demo
        workgroup_password: change-me
        display_name: dsh-orca
        port: 11811
        peers: []
